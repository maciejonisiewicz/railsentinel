<!doctype html><html lang="pl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; font-family: Inter, sans-serif; }
  .lt { position: absolute; left: 90px; bottom: 120px; display: flex; align-items: stretch; filter: drop-shadow(0 18px 50px rgba(0,0,0,.55)); }
  .lt .bar { width: 10px; background: #ffb020; border-radius: 6px 0 0 6px; }
  .lt .txt { background: rgba(7,10,15,.86); padding: 18px 30px 20px; border-radius: 0 14px 14px 0; color: #fff; }
  .lt b { display: block; font: 800 40px/1.1 Inter; letter-spacing: -.01em; }
  .lt span { display: block; font: 500 26px/1.3 Inter; color: #b9c4d2; margin-top: 4px; }
  .sub { position: absolute; left: 0; right: 0; bottom: 56px; text-align: center; }
  .sub span { display: inline-block; max-width: 1500px; background: rgba(0,0,0,.72); color: #fff; font: 700 38px/1.3 Inter;
              padding: 10px 24px; border-radius: 10px; }
  .anon { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 30%, #13233a, #070a0f 70%); }
  .anon .ic { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); width: 220px; height: 220px; border-radius: 50%;
              background: rgba(255,176,32,.12); border: 3px solid rgba(255,176,32,.6); display: grid; place-items: center; font-size: 110px; }
  .anon p { position: absolute; left: 0; right: 0; top: 52%; text-align: center; color: #b9c4d2; font: 600 30px Inter; }
</style></head><body><div id="root"></div>
<script>
const P = new URLSearchParams(location.search), k = P.get("k"), esc = (s) => (s || "").replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const R = document.getElementById("root");
if (k === "lt") R.innerHTML = `<div class="lt"><div class="bar"></div><div class="txt"><b>${esc(P.get("a"))}</b><span>${esc(P.get("b"))}</span></div></div>`;
if (k === "sub") R.innerHTML = `<div class="sub"><span>${esc(P.get("a"))}</span></div>`;
if (k === "anon") R.innerHTML = `<div class="anon"><div class="ic">🎙️</div><p>Rozmówca wystąpił anonimowo – nagranie głosu</p></div>`;
</script></body></html>
