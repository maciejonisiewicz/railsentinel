name: Codzienna prognoza

on:
  schedule:
    - cron: "15 3 * * *"     # codziennie ok. 4:15 (zima) / 5:15 (lato) czasu polskiego
  workflow_dispatch:          # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write

concurrency:
  group: prognoza
  cancel-in-progress: false

jobs:
  prognoza:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Zależności
        run: pip install -r requirements-live.txt

      - name: Prognoza na dziś i 2 kolejne dni (Open-Meteo + IMGW)
        run: |
          mkdir -p data/raw/weather
          python src/05_predict.py live

      - name: Publikacja na railsentinel.pl
        run: |
          git fetch origin gh-pages --depth=1
          git worktree add site FETCH_HEAD
          cp web/data/live.js site/data/live.js
          cd site
          git config user.name "RailSentinel"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.js
          if git diff --cached --quiet; then echo "bez zmian"; exit 0; fi
          git commit -q -m "Prognoza $(date +%F)"
          git push origin HEAD:gh-pages
