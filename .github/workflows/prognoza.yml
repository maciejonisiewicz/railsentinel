name: Codzienna prognoza

on:
  schedule:
    - cron: "15 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prognoza
  cancel-in-progress: false

jobs:
  prognoza:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Europe/Warsaw
      RS_LOG_DIR: data/log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Zależności
        run: pip install -r requirements-live.txt

      - name: Dziennik prognoz (gałąź logs)
        run: |
          git fetch origin logs:refs/remotes/origin/logs || true
          if git show-ref --verify --quiet refs/remotes/origin/logs; then
            git worktree add data/log refs/remotes/origin/logs
          else
            git worktree add --detach data/log
            git -C data/log checkout --orphan logs
            git -C data/log rm -rf . > /dev/null
          fi

      - name: Prognoza na dziś i 2 kolejne dni (Open-Meteo + IMGW)
        run: |
          mkdir -p data/raw/weather
          python src/05_predict.py live

      - name: Weryfikacja prospektywna
        run: python src/18_verify.py data/log/status.json

      - name: Zapis dziennika
        run: |
          cd data/log
          git config user.name "RailSentinel"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Przebieg $(date '+%F %H:%M')" || echo "bez zmian"
          git push origin HEAD:logs

      - name: Publikacja na railsentinel.pl
        run: |
          git fetch origin gh-pages --depth=1
          git worktree add site FETCH_HEAD
          cp web/data/live.js site/data/live.js
          cp data/log/status.json site/data/status.json
          python src/19_api.py site/api/v1
          cd site
          git config user.name "RailSentinel"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.js data/status.json api
          if git diff --cached --quiet; then echo "bez zmian"; exit 0; fi
          git commit -q -m "Prognoza $(date +%F)"
          git push origin HEAD:gh-pages
